name: Tests
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev,langgraph,openai,anthropic]'
      - run: python -m pytest -q

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: python -m venv .wheel-smoke
      - run: .wheel-smoke/bin/python -m pip install --no-deps dist/*.whl
      - run: .wheel-smoke/bin/chrolo --help
      - run: .wheel-smoke/bin/chrolo benchmark --repeat 1
