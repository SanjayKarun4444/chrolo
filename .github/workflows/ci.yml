name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev,langgraph,langchain,openai,anthropic]'
      - run: python -m pytest -q

  package-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'build>=1,<2' 'twine>=6.1,<7'
      - run: python -m build --outdir dist
      - run: python -m twine check --strict dist/*
      - run: python benchmarks/check_distribution.py --dist-dir dist --require-prerelease --report dist/distribution-check.json
      - run: python -m venv .wheel-smoke
      - run: .wheel-smoke/bin/python -m pip install --no-deps dist/*.whl
      - run: .wheel-smoke/bin/chrolo --help
      - run: .wheel-smoke/bin/chrolo --version
      - run: .wheel-smoke/bin/chrolo benchmark --repeat 1
      - name: Smoke test packaged minimize workflow
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          .wheel-smoke/bin/chrolo minimize examples/minimal.json \
            --run examples.buggy_agent:run \
            --oracle examples.buggy_agent:is_failure \
            --output "$RUNNER_TEMP/minimal.json" \
            --test "$RUNNER_TEMP/test_chrolo_regression.py"
          test -s "$RUNNER_TEMP/minimal.json"
          test -s "$RUNNER_TEMP/test_chrolo_regression.py"
      - name: Check installed-wheel capture-to-regression workflow
        run: |
          .wheel-smoke/bin/python -m pip install 'pytest>=8,<10'
          .wheel-smoke/bin/python benchmarks/package_workflow_smoke.py --output-dir "$RUNNER_TEMP/packaged-workflow"
      - name: Check installed-wheel SDK and LangGraph workflows
        run: |
          .wheel-smoke/bin/python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', glob.glob('dist/*.whl')[0] + '[langgraph,openai,anthropic]'])"
          .wheel-smoke/bin/python benchmarks/package_provider_smoke.py --output-dir "$RUNNER_TEMP/packaged-providers"
      - name: Retain validated distributions
        uses: actions/upload-artifact@v4
        with:
          name: chrolo-alpha-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/distribution-check.json
          if-no-files-found: error
