[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "chrolo-starter"
version = "0.2.0a1"
description = "Local failure-to-regression-test minimizer for AI agent workflows"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["agents", "debugging", "replay", "regression-testing", "delta-debugging"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/SanjayKarun4444/chrolo"
Repository = "https://github.com/SanjayKarun4444/chrolo"
Documentation = "https://github.com/SanjayKarun4444/chrolo/blob/master/README.md"
Issues = "https://github.com/SanjayKarun4444/chrolo/issues"
Changelog = "https://github.com/SanjayKarun4444/chrolo/blob/master/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
release = ["build>=1,<2", "twine>=6.1,<7"]
langgraph = ["langgraph>=1.0,<2"]
langchain = ["langchain-core>=1.0,<2"]
openai = ["openai>=1.66,<3"]
anthropic = ["anthropic>=0.49,<1"]

[project.scripts]
chrolo = "chrolo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
