[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chrolo-starter"
version = "0.2.0"
description = "Local failure-to-regression-test minimizer for AI agent workflows"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
langgraph = ["langgraph>=1.0,<2"]
langchain = ["langchain-core>=1.0,<2"]

[project.scripts]
chrolo = "chrolo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
